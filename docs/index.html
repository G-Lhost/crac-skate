<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>CRAC ! — Eduardo Skate Rush</title>

<!-- viewport-fit=cover : la page passe sous l'encoche, on gere les marges en CSS -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Eduardo enfourche sa planche : sautez les frites, les altères, l'amaretto et les béquilles. Suite optimisée du jeu de 2016.">
<meta name="theme-color" content="#262a6e">

<!-- Mode application plein ecran une fois ajoute a l'ecran d'accueil -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CRAC !">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<style>
  @font-face {
    font-family: 'BradBunR';
    src: url('assets/font/brad.woff') format('woff'),
         url('assets/font/brad.ttf') format('truetype');
    font-display: block;
  }

  :root { --sky: #262a6e; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #060714;
    color: #fff;
    font-family: 'BradBunR', Impact, 'Arial Black', system-ui, sans-serif;
    /* Rien ne doit pouvoir etre selectionne, zoome ou fait defiler. */
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    touch-action: none;
  }

  #stage {
    position: fixed; inset: 0;
    /* On reste a l'ecart de l'encoche et de la barre d'accueil de l'iPhone. */
    padding:
      env(safe-area-inset-top) env(safe-area-inset-right)
      env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: #060714;
  }

  #game { display: block; width: 100%; height: 100%; touch-action: none; }

  /* --- ecran de chargement --- */
  #loader {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    background: linear-gradient(180deg, #262a6e, #6c76d6);
    transition: opacity .35s ease;
  }
  #loader.gone { opacity: 0; pointer-events: none; }
  #loader h1 { font-size: clamp(48px, 13vw, 130px); letter-spacing: 2px; }
  #loader p { font-size: clamp(14px, 3.4vw, 26px); color: #ffc440; }
  #track { width: min(60vw, 340px); height: 8px; border-radius: 99px;
           background: rgba(255,255,255,.22); overflow: hidden; }
  #bar { height: 100%; width: 0; background: #ffc440; transition: width .18s ease; }

  /* --- invitation a tourner le telephone --- */
  #rotate {
    position: fixed; inset: 0; z-index: 20; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center; padding: 24px;
    background: rgba(8, 10, 26, .93);
  }
  body.portrait #rotate { display: flex; }
  #rotate .phone {
    width: 74px; height: 122px; border: 4px solid #ffc440; border-radius: 12px;
    animation: tilt 1.9s ease-in-out infinite;
  }
  #rotate p { font-size: clamp(18px, 5vw, 30px); }
  #rotate small { font-size: clamp(12px, 3.4vw, 18px); color: #b9bfe8;
                  font-family: system-ui, sans-serif; }
  @keyframes tilt {
    0%, 45% { transform: rotate(0deg); }
    70%, 100% { transform: rotate(-90deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    #rotate .phone { animation: none; transform: rotate(-90deg); }
  }
</style>
</head>
<body>
  <div id="stage"><canvas id="game"></canvas></div>

  <div id="rotate">
    <div class="phone"></div>
    <p>Tournez votre téléphone</p>
    <small>CRAC ! se joue en mode paysage.</small>
  </div>

  <div id="loader">
    <h1>CRAC&nbsp;!</h1>
    <p>Eduardo Skate Rush</p>
    <div id="track"><div id="bar"></div></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
